.id td{padding:4px 0;vertical-align:top}.id td:first-child{color:var(--m);width:38%}

.tm.y{background:var(--y);color:#000}.tm.r{background:var(--r)}

.opt.on{border-color:var(--b);background:var(--bl)}.opt b{min-width:24px;height:24px;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:13px;color:#000}.opt.on b{background:var(--b);color:#fff}

@media print{.top,.tabs,button,.noprint{display:none!important}}
